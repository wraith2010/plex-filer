# Install to /etc/plex-filer/config.toml
# The API key is NOT stored here: put ANTHROPIC_API_KEY in /etc/plex-filer/env

[claude]
model = "claude-haiku-5-5"
batch_size = 20
min_confidence = 0.8        # below this, the file goes to review instead of the library

[paths]
tv_source     = "/data/stage/tvshows"
tv_library    = "/mnt/plex/tvshows"
movie_source  = "/data/stage/movies"
movie_library = "/mnt/plex/movies"     # flat: "Movie Name (Year).mkv", no subfolders
review_dir    = "/data/stage/review"   # unidentified files + a .json with Claude's reasoning
state_dir     = "/var/lib/plex-filer"

[notify]
# One summary email per run; nothing is sent when a run had nothing to report.
# SMTP_USER and SMTP_PASSWORD (a Gmail app password) go in /etc/plex-filer/env.
# On by default: email is sent whenever SMTP_USER/SMTP_PASSWORD are set. false = never.
notify_enabled = true
smtp_host = "smtp.gmail.com"
smtp_port = 587
mail_from = ""                       # blank = same as SMTP_USER
mail_to   = ""                       # blank = same as SMTP_USER (mail yourself)

[behavior]
age_minutes = 60            # a file must be untouched this long (download-complete heuristic)
min_video_mb = 50           # smaller files are treated as samples/stubs
pad_season_folder = false   # false: "Season 4" (matches current library)  true: "Season 04"
# Empty movie_source as movies are handled: filed, duplicate, sent to review, or junk.
# Release folders left with only .nfo/.srt/.jpg-style clutter are removed too.
# TV is never drained (its source is the seeding dir).
delete_movie_source = true
